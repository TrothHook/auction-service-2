service: sls-base

custom:
  region: us-east-1

provider:
  name: aws
  runtime: nodejs18.x
  region: ${self:custom.region}
  memorySize: 256
  stage: ${opt:stage, 'dev'}
  lambdaHashingVersion: 20201221
  iamRoleStatements:
    - ${file(iam/AuctionsTableIAM.yml):AuctionsTableIAM}

resources:
  Resources:
    AuctionsTable: ${file(resources/AuctionsTable.yml):AuctionsTable}

functions:
  createAuction:
    handler: src/handler.createAuction
    events:
      - http:
          method: POST
          path: /auction

package:
  individually: true
